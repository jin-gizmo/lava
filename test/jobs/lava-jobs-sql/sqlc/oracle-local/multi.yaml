$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Oracle SQL*Plus job with multiple queries in same file

type: sqlc

job_id: <{ prefix.job }>/sqlc/oracle-local/multi

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: <{ prefix.payload }>/sql.rsc/onecol-multi.sql

parameters:
  conn_id: <{ prefix.conn }>/db/oracle/local
  timeout: 30s
  vars:
    table: sqlc_oracle_multi

x-lava-nocheck: joborphan
x-lava-test:
  result: OK
  marks:
    - local
