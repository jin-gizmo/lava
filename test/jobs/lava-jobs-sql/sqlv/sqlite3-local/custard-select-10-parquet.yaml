$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - SQLite3 custard select 10 rows (Parquet format)

type: sqlv

job_id: <{ prefix.job }>/sqlv/sqlite3-local/custard-select-10-parquet

payload: <{ prefix.payload }>/sql.rsc/custard-select-noschema.sql

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

parameters:
  conn_id: <{ prefix.conn }>/db/sqlite3/test

  format: parquet

  transaction: true
  level: debug
  vars:
    limit: 10

x-lava-nocheck: joborphan

x-lava-test:
  result: OK
  marks:
    - local
