$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: Fail - SQL Server delete custard rollback

type: sqlv

job_id: <{ prefix.job }>/sqlv/mssql-local/custard-rollback

payload: <{ prefix.payload }>/sql.rsc/custard-rollback.sql

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

parameters:
  conn_id: <{ prefix.conn }>/db/mssql/local
  transaction: true
  vars:
    table: sqlv_mssql_custard_rollback

x-lava-nocheck: joborphan

x-lava-test:
  result: FAIL
  error_pattern: 'Failed with exit status 1'
  marks:
    - local
