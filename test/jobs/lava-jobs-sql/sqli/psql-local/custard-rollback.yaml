$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: FAIL - Bad query syntax on Postgres will cause rollback

type: sqli

job_id: <{ prefix.job }>/sqli/psql-local/custard-rollback

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload:
  - DELETE FROM <{db.common.schema}>.custard;
  - BAD SYNTAX WILL CAUSE ROLLBACK;

parameters:
  conn_id: <{ prefix.conn }>/db/psql/local
  transaction: true

x-lava-nocheck: joborphan
x-lava-test:
  result: FAIL
  marks:
    - local
