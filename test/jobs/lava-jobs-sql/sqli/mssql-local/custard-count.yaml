$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - SQL Server custard count

type: sqli

job_id: <{ prefix.job }>/sqli/mssql-local/custard-count

payload: "SELECT COUNT(*) FROM <{db.common.schema}>.custard"

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

parameters:
  conn_id: <{ prefix.conn }>/db/mssql/local

x-lava-nocheck: joborphan
x-lava-test:
  result: OK
  marks:
    - local
