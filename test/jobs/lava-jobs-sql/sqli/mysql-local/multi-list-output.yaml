$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Aurora MySQL multiple statements in string payload with specified output area

type: sqli

job_id: <{ prefix.job }>/sqli/mysql-local/multi-list-output

# Some elements end in ; some don't.
payload:
  - SELECT count(*) FROM <{db.common.schema}>.onecol;
  - INSERT INTO <{ db.common.schema }>.onecol VALUES ('{{job.run_id}}')
  - SELECT count(*) FROM <{db.common.schema}>.onecol;

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

parameters:
  conn_id: <{ prefix.conn }>/db/mysql/local
  transaction: true
  output: my_output_area

x-lava-nocheck: joborphan
x-lava-test:
  result: OK
  marks:
    - local
