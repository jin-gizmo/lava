$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Redshift custard count with specified output area

type: sqli

job_id: <{ prefix.job }>/sqli/redshift/custard-count-output

payload: "SELECT COUNT(*) FROM <{db.common.schema}>.custard"

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

parameters:
  conn_id: <{ prefix.conn }>/db/redshift/base
  output: my_output_area

x-lava-nocheck: joborphan
