$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Redshift check for application name in stl_connection_log (pg8000)

type: sqli

job_id: <{ prefix.job }>/sqli/redshift/appname/pg8000

payload: >-
  SELECT rtrim(username) as user,
         substring(event,1,20) as event,
         recordtime,
         rtrim(remotehost) as host,
         rtrim(authmethod) as auth,
         rtrim(sslversion) as ssl,
         rtrim(application_name) as app_name
  FROM stl_connection_log
  WHERE username like '%lava%'
  ORDER BY recordtime desc
  LIMIT 5;

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

parameters:
  conn_id: <{ prefix.conn }>/db/redshift/base

x-lava-nocheck: joborphan
