$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: FAIL - SQLite3 custard select 10 rows with a bad dialect

type: sql

job_id: <{ prefix.job }>/sql/sqlite3-local/custard-select-dialect-bad

payload: <{ prefix.payload }>/sql.rsc/custard-select-noschema.sql

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

parameters:
  conn_id: <{ prefix.conn }>/db/sqlite3/test

  dialect: bad
  quoting: nonnumeric
  delimiter: ","

  transaction: true
  vars:
    limit: 10

x-lava-nocheck: joborphan

x-lava-test:
  result: FAIL
  error_pattern: 'unknown dialect'
  marks:
    - local
