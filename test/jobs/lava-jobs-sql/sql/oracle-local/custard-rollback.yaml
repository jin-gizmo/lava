$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: FAIL - Bad query syntax on Oracle will cause rollback

type: sql

job_id: <{ prefix.job }>/sql/oracle-local/custard-rollback

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: <{ prefix.payload }>/sql.rsc/custard-rollback.sql

parameters:
  conn_id: <{ prefix.conn }>/db/oracle/local
  transaction: true
  vars:
    table: sql_oracle_custard_rollback

x-lava-nocheck: joborphan
x-lava-test:
  result: FAIL
  error_pattern: 'invalid SQL statement'
  marks:
    - local
