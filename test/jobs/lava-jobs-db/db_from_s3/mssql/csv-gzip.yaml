$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - CSV/GZIP truncate load for SQL Server

type: db_from_s3

job_id: <{ prefix.job }>/db_from_s3/mssql/csv-gzip

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: --

parameters:
  db_conn_id: <{ prefix.conn }>/db/mssql/base

  args:
    - DELIMITER ','
    - GZIP

  bucket: "{{ utils.s3bucket(realm.s3_payloads) }}"
  key: "{{ utils.s3key(realm.s3_payloads) }}/<{ prefix.payload }>/data.raw/custard100-noheader.csv.gz"

  mode: truncate
  schema: <{ db.common.schema }>
  table: custard

x-lava-nocheck: joborphan
