$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: Fail - Local Postgres fails to load file missing from S3.

type: db_from_s3

job_id: <{ prefix.job }>/db_from_s3/psql-local/missing-file-fail

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: --

parameters:
  db_conn_id: <{ prefix.conn }>/db/psql/local

  bucket: "{{ utils.s3bucket(realm.s3_payloads) }}"
  key: "{{ utils.s3key(realm.s3_payloads) }}/<{ prefix.payload }>/no/such/file.csv"

  schema: <{ db.common.schema }>
  table: custard

  mode: append

  args:
    - FORMAT CSV
    - DELIMITER ','
    - HEADER

  # <% from '_common/columns.jinja' import columns_custard %>
  columns: <{ columns_custard }>

x-lava-nocheck: joborphan

x-lava-test:
  result: FAIL
  error_pattern: "Download failed: .* Not Found"
  marks:
    - local
