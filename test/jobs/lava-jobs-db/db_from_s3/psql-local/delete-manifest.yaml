$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Postgres delete load csv with manifest using role

type: db_from_s3

job_id: <{ prefix.job }>/db_from_s3/psql-local/delete-manifest

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: --

parameters:
  db_conn_id: <{ prefix.conn }>/db/psql/local

  bucket: "{{ utils.s3bucket(realm.s3_payloads) }}"
  key: "{{ utils.s3key(realm.s3_payloads) }}/<{ prefix.payload }>/misc.rsc/custard.csv.manifest"

  schema: <{ db.common.schema }>
  table: custard

  mode: delete

  args:
    - FORMAT CSV
    - MANIFEST
    - HEADER
    - GZIP

x-lava-nocheck: joborphan

x-lava-test:
  result: OK
  marks:
    - local
