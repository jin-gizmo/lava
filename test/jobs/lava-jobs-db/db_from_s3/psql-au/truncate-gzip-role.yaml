$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Aurora Postgres truncate load gzip data using role

type: db_from_s3

job_id: <{ prefix.job }>/db_from_s3/psql-au/truncate-gzip-role

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: --

parameters:
  db_conn_id: <{ prefix.conn }>/db/psql/aurora

  bucket: "{{ utils.s3bucket(realm.s3_payloads) }}"
  key: "{{ utils.s3key(realm.s3_payloads) }}/<{ prefix.payload }>/data.raw/custard100.csv.gz"

  schema: <{ db.common.schema }>
  table: custard

  mode: truncate

  args:
    - FORMAT CSV
    - DELIMITER ','
    - HEADER
    - GZIP

x-lava-nocheck: joborphan
