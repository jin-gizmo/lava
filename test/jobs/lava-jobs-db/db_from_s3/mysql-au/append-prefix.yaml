$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Aurora MySQL append load from an S3 prefix

type: db_from_s3

job_id: <{ prefix.job }>/db_from_s3/mysql-au/append-prefix

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: --

parameters:
  db_conn_id: <{ prefix.conn }>/db/mysql/aurora

  bucket: "{{ utils.s3bucket(realm.s3_payloads) }}"
  key: "{{ utils.s3key(realm.s3_payloads) }}/<{ prefix.payload }>/data.raw/prefix/"

  schema: <{ db.common.schema }>
  table: vcustard

  mode: append

  args:
    - DELIMITER ','
    - HEADER 1
    - PREFIX
    - TERMINATOR UNIX

x-lava-nocheck: joborphan
