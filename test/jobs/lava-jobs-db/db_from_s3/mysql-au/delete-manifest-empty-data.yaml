$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - MySQL Aurora delete load manifest -- with data + empty file

type: db_from_s3

job_id: <{ prefix.job }>/db_from_s3/mysql-au/delete-manifest-empty-data

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: --

parameters:
  db_conn_id: <{ prefix.conn }>/db/mysql/aurora

  bucket: "{{ utils.s3bucket(realm.s3_payloads) }}"
  key: "{{ utils.s3key(realm.s3_payloads) }}/<{ prefix.payload }>/misc.rsc/custard+empty-nogz.csv.manifest"

  schema: <{ db.common.schema }>
  table: vcustard

  mode: delete
  min_size: 100

  args:
    - DELIMITER ','
    - HEADER 1
    - TERMINATOR '\n'
    - MANIFEST

x-lava-nocheck: joborphan
