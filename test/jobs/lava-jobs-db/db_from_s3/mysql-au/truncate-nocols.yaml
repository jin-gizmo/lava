$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Aurora MySQL truncate load (no cols)

type: db_from_s3

job_id: <{ prefix.job }>/db_from_s3/mysql-au/truncate-nocols

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: --

parameters:
  db_conn_id: <{ prefix.conn }>/db/mysql/aurora

  bucket: "{{ utils.s3bucket(realm.s3_payloads) }}"
  key: "{{ utils.s3key(realm.s3_payloads) }}/<{ prefix.payload }>/data.raw/custard100.csv"

  schema: <{ db.common.schema }>
  table: vcustard

  mode: truncate

  args:
    - DELIMITER ','
    - HEADER 1
    - TERMINATOR UNIX

x-lava-nocheck: joborphan
