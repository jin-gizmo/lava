$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - oracle delete load csv with manifest

type: db_from_s3

job_id: <{ prefix.job }>/db_from_s3/oracle-local/delete-manifest

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: --

parameters:
  db_conn_id: <{ prefix.conn }>/db/oracle/local

  bucket: "{{ utils.s3bucket(realm.s3_payloads) }}"
  key: "{{ utils.s3key(realm.s3_payloads) }}/<{ prefix.payload }>/misc.rsc/custard.csv.manifest"

  schema: <{ db.common.schema }>
  table: custard

  mode: delete

  args:
    - MANIFEST
    - HEADER
    - GZIP
    - NLS_DATE_FORMAT='YYYY-MM-DD'

x-lava-nocheck: joborphan
x-lava-test:
  result: OK
  marks:
    - local
