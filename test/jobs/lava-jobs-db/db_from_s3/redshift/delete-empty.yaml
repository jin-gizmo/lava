$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Redhift delete load of an empty data set.

type: db_from_s3
job_id: <{ prefix.job }>/db_from_s3/redshift/delete-empty

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: --

parameters:
  db_conn_id: <{ prefix.conn }>/db/redshift/base

  bucket: "{{ utils.s3bucket(realm.s3_payloads) }}"
  key: "{{ utils.s3key(realm.s3_payloads) }}/<{ prefix.payload }>/data.raw/empty.csv"

  schema: <{ db.common.schema }>
  table: custard

  mode: delete
  min_size: 1

  args:
    - CSV

x-lava-nocheck: joborphan
