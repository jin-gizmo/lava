$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Postgres truncate load of empty file (no header)

type: db_from_s3

job_id: <{ prefix.job }>/db_from_s3/psql/truncate-empty-data

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: --

parameters:
  db_conn_id: <{ prefix.conn }>/db/psql/base

  bucket: "{{ utils.s3bucket(realm.s3_payloads) }}"
  key: "{{ utils.s3key(realm.s3_payloads) }}/<{ prefix.payload }>/data.raw/empty.csv"

  schema: <{ db.common.schema }>
  table: custard

  mode: truncate

  args:
    - FORMAT CSV
    - DELIMITER ','

x-lava-nocheck: joborphan
