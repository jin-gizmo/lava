$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Redshift unload partition - sex,favouritecustard

type: redshift_unload

job_id: <{ prefix.job }>/rsu/partition-2

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: --

parameters:
  conn_id: <{ prefix.conn }>/db/redshift/base
  s3_conn_id: <{ prefix.conn }>/aws/ssm

  schema: <{ db.common.schema }>
  relation:
    - custard

  bucket: "<{ s3.bucket.unload }>"
  prefix: "{{ utils.s3key(realm.s3_temp) }}/test/rsu/partition/sex+fav/{{schema}}/{{relation}}/"

  args:
    - CSV
    - ALLOWOVERWRITE
    - PARALLEL OFF
    - GZIP
    - PARTITION BY (sex, favouritecustard)

  dateformat: YYYY-MM-DD

  insecure: <{ rsu.insecure }>

x-lava-nocheck: joborphan
