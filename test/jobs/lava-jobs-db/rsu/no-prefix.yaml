$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: FAIL - No prefix specified

type: redshift_unload

job_id: <{ prefix.job }>/rsu/no-prefix

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: --

parameters:
  conn_id: <{ prefix.conn }>/db/redshift/base
  s3_conn_id: <{ prefix.conn }>/aws/ssm

  bucket: "<{ s3.bucket.unload }>"
  # Missing prefix

  schema: <{ db.common.schema }>
  relation: custard

  args:
    - CSV
    - ALLOWOVERWRITE
    - PARALLEL OFF
    - HEADER
    - GZIP

  dateformat: YYYY-MM-DD

  insecure: <{ rsu.insecure }>

x-lava-nocheck: joborphan

x-lava-test:
  result: FAIL
  error_pattern: "Bad job parameters: prefix is required"
  marks:
    - local
