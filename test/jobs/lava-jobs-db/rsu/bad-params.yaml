$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: FAIL - Bad parameters

type: redshift_unload

job_id: <{ prefix.job }>/rsu/bad-params

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: --

parameters:
  bad: to the bone
  conn_id: <{ prefix.conn }>/db/redshift/base
  s3_conn_id: <{ prefix.conn }>/aws/ssm

  bucket: "<{ s3.bucket.unload }>"
  prefix: "{{ utils.s3key(realm.s3_temp) }}/test/rsu/{{schema}}/{{relation}}.csv.gz."

  schema: <{ db.common.schema }>
  relation: custard

  args:
    - CSV
    - ALLOWOVERWRITE
    - PARALLEL OFF
    - HEADER
    - GZIP

  dateformat: YYYY-MM-DD

  insecure: <{ rsu.insecure }>

x-lava-nocheck: joborphan

x-lava-test:
  result: FAIL
  error_pattern: "Unexpected keys: bad"
  marks:
    - local
