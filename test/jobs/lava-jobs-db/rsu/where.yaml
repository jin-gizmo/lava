$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Redshift unload with WHERE clause

type: redshift_unload

job_id: <{ prefix.job }>/rsu/where

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: --

parameters:
  conn_id: <{ prefix.conn }>/db/redshift/base
  s3_conn_id: <{ prefix.conn }>/aws/ssm

  bucket: "<{ s3.bucket.unload }>"
  prefix: "{{ utils.s3key(realm.s3_temp) }}/test/rsu/{{schema}}/sex=F/{{relation}}.csv.gz."

  schema: <{ db.common.schema }>
  relation: custard

  where: sex='F'

  args:
    - CSV
    - ALLOWOVERWRITE
    - PARALLEL OFF
    - HEADER
    - GZIP

  dateformat: YYYY-MM-DD

  insecure: <{ rsu.insecure }>

x-lava-nocheck: joborphan
