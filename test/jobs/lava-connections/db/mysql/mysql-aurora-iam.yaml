$schema: http://127.0.0.1:8000/schemas/latest/connection.schema.yaml

description: Aurora MySQL with AWS IAM auth
owner: "<{ owner }>"

type: mysql-aurora

conn_id: <{ prefix.conn }>/db/mysql/aurora-iam
enabled: true

host: <{ db.mysql_aurora.host }>
port: <{ db.mysql_aurora.port }>
ssl: true
database: <{ db.mysql_aurora.database }>

# IAM authenticated user so no password
user: <{ db.mysql_aurora.user }>_iam
