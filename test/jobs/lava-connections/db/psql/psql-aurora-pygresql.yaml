$schema: http://127.0.0.1:8000/schemas/latest/connection.schema.yaml

description: Aurora Postgres connector using PyGreSQL
owner: "<{ owner }>"

type: postgres-aurora
subtype: pygresql

conn_id: <{ prefix.conn }>/db/psql/aurora-pygresql
enabled: true

database:  <{ db.psql_aurora.database }>
host: <{ db.psql_aurora.host }>
port: <{ db.psql_aurora.port }>
ssl_mode: verify-full

user: <{ db.psql_aurora.user }>
password:  <{ prefix.ssm }>/psql_aurora/<{ db.psql_aurora.user }>/password
