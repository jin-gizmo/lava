$schema: http://127.0.0.1:8000/schemas/latest/connection.schema.yaml

description: >-
  Redshift connector using the AWS Redshift driver with no password
  (uses Redshift GetClusterCredentials API)
owner: "<{ owner }>"

type: redshift
subtype: redshift

conn_id: <{ prefix.conn }>/db/redshift/awsdriver-nopass
enabled: true

host: <{ db.redshift.host }>
port: <{ db.redshift.port }>
ssl: true
database: <{ db.redshift.database }>

user: <{ db.redshift.user }>
