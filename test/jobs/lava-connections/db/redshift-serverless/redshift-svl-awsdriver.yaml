$schema: http://127.0.0.1:8000/schemas/latest/connection.schema.yaml

description: Redshift Serverless connector using the AWS Redshift driver
owner: "<{ owner }>"

type: redshift-serverless
subtype: redshift

conn_id: <{ prefix.conn }>/db/redshift/svl-awsdriver
enabled: true

host: <{ db.redshift_svl.host }>
port: <{ db.redshift_svl.port }>
ssl_mode: verify-full
database: <{ db.redshift_svl.database }>

user: <{ db.redshift.user }>
password:  <{ prefix.ssm }>/redshift/<{ db.redshift_svl.user }>/password
