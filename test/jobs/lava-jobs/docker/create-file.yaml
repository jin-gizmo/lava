$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Create a local file in the container

type: docker

job_id: <{ prefix.job }>/docker/create-file

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: <{ docker.registry }>/lava/amzn2023/base

parameters:
  command: /bin/sh -c 'cat /etc/os-release; pwd; touch frog ; ls -la'
  docker: <{ prefix.conn }>/docker/base
  timeout: 30s

x-lava-nocheck: joborphan
