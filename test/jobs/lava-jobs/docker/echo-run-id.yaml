$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Echo job run_id in container

type: docker

job_id: <{ prefix.job }>/docker/echo-run-id

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: <{ docker.registry }>/lava/amzn2023/base

parameters:
  command: echo {{job.run_id}}
  docker: <{ prefix.conn }>/docker/base
  timeout: 10s

x-lava-nocheck: joborphan
