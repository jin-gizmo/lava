$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: FAIL - Bad payload

type: dag

job_id: <{ prefix.job }>/dag/bad-params

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload:
  <{ prefix.job }>/log/plain: null
  <{ prefix.job }>/cmd/hello-world: <{ prefix.job }>/log/plain

parameters:
  oingo: boingo
  workers: 2

x-lava-nocheck: joborphan

x-lava-test:
  result: FAIL
  error_pattern: "Bad job parameters: Unexpected keys: oingo"
  marks:
    - local
