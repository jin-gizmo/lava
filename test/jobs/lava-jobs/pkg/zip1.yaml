$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Run a simple pkg job and create (unused) git / ssh connectors

type: pkg

job_id: "<{ prefix.job }>/pkg/zip1"

worker: "<{ worker.main }>"
enabled: true
owner: "<{ owner }>"

payload: "<{ prefix.payload }>/lava_info.zip"

parameters:
  args:
    - '{{realm.realm}}'
    - payload area={{realm.s3_payloads}}
  connections:
    git: "<{ prefix.conn }>/git"
    ssh: "<{ prefix.conn }>/ssh"
  command: lava_info.sh

x-lava-nocheck: joborphan

x-lava-test:
  result: OK
  marks:
    - local
