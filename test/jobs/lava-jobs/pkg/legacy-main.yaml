$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - pkg job with zero exit status using the legacy "main" parameter

type: pkg

job_id: <{ prefix.job }>/pkg/legacy-main

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: <{ prefix.payload }>/exit.zip

parameters:
  main: exit.sh {{vars.status}}
  vars:
    status: 0

x-lava-nocheck: joborphan

x-lava-test:
  result: OK
  marks:
    - local
