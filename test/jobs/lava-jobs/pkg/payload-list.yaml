$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - pkg job with payload list (allowed with v2 downloader)

type: pkg

job_id: <{ prefix.job }>/pkg/payload-list

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload:
  - <{ prefix.payload }>/exit.zip

parameters:
  command: exit.sh {{vars.status}}
  vars:
    status: 0

x-lava-nocheck: joborphan

