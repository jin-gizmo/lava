$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: FAIL - Bad parameters

type: pkg

job_id: <{ prefix.job }>/pkg/bad-params

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: <{ prefix.payload }>/exit.zip

parameters:
  bad: to the bone
  command: exit.sh {{vars.status}}
  vars:
    status: 0

x-lava-nocheck: joborphan

x-lava-test:
  result: FAIL
  error_pattern: "Unexpected keys: bad"
  marks:
    - local
