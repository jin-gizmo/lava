$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: >-
  FAIL - foreach with child on different worker.
  Requires setup to mutate parent job spec worker.

type: foreach

job_id: <{ prefix.job }>/foreach/wrong-worker


worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: <{ prefix.job }>/cmd/print-globals

globals:
  from_the_parent: howdy

parameters:
  foreach:
    type: inline
    values:
      - a: A
        b: B
      - a: AA
        b: BB

x-lava-nocheck: joborphan

x-lava-test:
  result: FAIL
  error_pattern: "Worker mismatch: Expected .* but got .*"
  marks:
    - local
