$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Simple inline foreach to show global propagation.

type: foreach

job_id: <{ prefix.job }>/foreach/inline/ok

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: <{ prefix.job }>/cmd/print-globals

globals:
  from_the_parent: howdy

parameters:
  foreach:
    type: inline
    values:
      - a: A
        b: B
      - a: AA
        b: BB

x-lava-nocheck: joborphan

x-lava-test:
  result: OK
  marks:
    - local
