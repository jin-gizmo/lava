$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - query foreach exceeding hard limit.

type: foreach

job_id: <{ prefix.job }>/foreach/query/limit

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: <{ prefix.job }>/cmd/print-globals

globals:
  from_the_parent: howdy

parameters:
  limit: 1
  foreach:
    type: query
    conn_id: <{ prefix.conn }>/db/sqlite3/test
    query: |
      SELECT * FROM custard

x-lava-nocheck: joborphan
