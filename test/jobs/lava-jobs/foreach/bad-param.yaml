$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: FAIL - foreach with a bad parameter

type: foreach

job_id: <{ prefix.job }>/foreach/bad-param


worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: <{ prefix.job }>/cmd/print-globals

globals:
  from_the_parent: howdy

parameters:
  bad: blood
  foreach:
    type: inline
    values:
      - a: A
        b: B
      - a: AA
        b: BB

x-lava-nocheck: joborphan

x-lava-test:
  result: FAIL
  error_pattern: "Bad job parameters: Unexpected keys: bad"
  marks:
    - local
