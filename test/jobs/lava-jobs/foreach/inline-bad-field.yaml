$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - inline foreach with illegal field name

type: foreach

job_id: <{ prefix.job }>/foreach/inline/bad-field

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: <{ prefix.job }>/cmd/print-globals

globals:
  from_the_parent: howdy

parameters:
  foreach:
    type: inline
    values:
      - a: A
        b: B
      - a: AA
        b: BB
        LAVA_rocks: ok

x-lava-nocheck: joborphan
