$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Dict schedule that is not active

type: log

job_id: <{ prefix.job }>/lavasched/dict-inactive

worker: <{ worker.main }>
owner: <{ owner }>
enabled: true

dispatcher: localtime
schedule:
  # No active schedules so no entry in the crontab for this job
  crontab: '0 0 31 2 *'
  to: '2020-01-01T00:00:00Z'
  from: '3000-12-31T23:59:00Z'
payload: --

x-lava-nocheck: joborphan
