$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Job dynamically disabled - check if global 'a' is a palindrome

type: log

job_id: <{ prefix.job }>/disabled/global

worker: <{ worker.main }>
owner: <{ owner }>

enabled: |
  {% set word = globals.a | lower %}
  {{ word == word | reverse }}

globals:
  '#': Global a is not a palindrome.
  a: not-A-palindrome

payload: ignored

x-lava-nocheck: joborphan
