$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: FAIL - SMB get to local target is directory

type: exe

job_id: <{ prefix.job }>/smb/pysmb/exe-get-fail-target-is-directory

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: <{ prefix.payload }>/smb-get.sh

parameters:
  connections:
    smb: <{ prefix.conn }>/smb/<{ smb.name }>/pysmb

  args:
    - "FAIL: SMB to local target is directory"
    - <{ smb.volume }>:<{ smb.dir }>/hosts
    - /tmp

x-lava-nocheck: joborphan
x-lava-test:
  result: FAIL
  marks:
    - local
