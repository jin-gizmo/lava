$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: FAIL - Non-existent S3 bucket to SMB put

type: exe

job_id: <{ prefix.job }>/smb/smbprotocol/exe-put-fail-no-such-bucket

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: <{ prefix.payload }>/smb-put.sh

parameters:
  connections:
    smb: <{ prefix.conn }>/smb/<{ smb.name }>/smbprotocol

  args:
    - "FAIL: Non-existent S3 bucket to SMB"
    - s3://this-has-got-to-be-bad-bucket/whatever
    - <{ smb.volume }>:<{ smb.dir }>/hosts

x-lava-nocheck: joborphan
x-lava-test:
  result: FAIL
  marks:
    - local
