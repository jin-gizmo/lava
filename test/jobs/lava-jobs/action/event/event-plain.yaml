$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Test on_success action sending plain event to EventBridge

type: cmd

job_id: <{ prefix.job }>/action/event/plain

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: >-
  echo This job has an action to send to raise a plain EventBridge event.
  See log group /aws/events/lava

on_success:
  - action: event
    event_bus: default
    resources:
      - "{{ realm.realm }}"
      - "{{ job.worker }}"

    detail: "It worked!"

x-lava-nocheck: joborphan

x-lava-test:
  result: OK
  marks:
    - local
