$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Action to send email with an attachment with SES connector

type: cmd

job_id: <{ prefix.job }>/action/email/ses-conn-attach

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: echo This job uses an action to send an email with an attachment with SES connector

parameters:
  args:
    - <{ prefix.conn }>/email/ses
    - email connector

on_success:
  - action: email
    to: <{ email.test1 }>
    subject: Attachment test
    message: |
      <HTML>
        <BODY>
          <h1>Attachment test</h1>
          This should have the lava icon as an attachment
        </BODY>
      </HTML>
    email_conn: <{ prefix.conn }>/email/ses
    attachments:
      - '{{ realm.s3_payloads }}/<{ prefix.payload }>/misc.raw/lava-icon-512-transparent.png'

x-lava-nocheck: joborphan
