$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Action to send email with an attachment with an SMTP connector

type: cmd

job_id: <{ prefix.job }>/action/email/smtp-conn-attach

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: echo This job uses an action to send an email with an attachment with an SMTP connector

on_success:
  - action: email
    email_conn: <{ prefix.conn }>/email/smtp-local
    to: <{ email.test1 }>
    subject: "{{ job.job_id }} {{ job.run_id }}"
    message: |
      <HTML>
        <BODY>
          <h1>Attachment test</h1>
          This should have the lava icon as an attachment
        </BODY>
      </HTML>
    attachments:
      - '{{ realm.s3_payloads }}/<{ prefix.payload }>/misc.raw/lava-icon-512-transparent.png'

x-lava-nocheck: joborphan

x-lava-test:
  result: OK
  marks:
    - local
