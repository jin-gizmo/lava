$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Action to send plaintext email using an email connector

type: cmd

job_id: <{ prefix.job }>/action/email/ses-conn-text

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: echo This job uses an action to send a plaintext email using email connector

on_success:
  - action: email
    email_conn: <{ prefix.conn }>/email/ses
    to: <{ email.test1 }>
    subject: "{{ job.description }}"
    message: |
      Job ID: {{ job.job_id }}
      Run ID: {{ job.run_id }}
      Start:  {{ ustart }}

x-lava-nocheck: joborphan
