$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Action to send an HTML email using an SMTP email connector

type: cmd

job_id: <{ prefix.job }>/action/email/smtp-conn-html

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload: echo This job uses an action to send an HTML email using an SMTP email connector

on_success:
  - action: email
    email_conn: <{ prefix.conn }>/email/smtp-local
    to: <{ email.test1 }>
    subject: "{{ job.job_id }} {{ job.run_id }}"
    message: |
      <HTML>
        <BODY>
          <b>Description:</b> {{ job.description }}<br>
          <b>Job ID:</b> {{ job.job_id }}<br>
          <b>Run ID:</b> {{ job.run_id }}<br>
          <b>Start:</b>  {{ ustart }}<br>
        </BODY>
      </HTML>

x-lava-nocheck: joborphan

x-lava-test:
  result: OK
  marks:
    - local
