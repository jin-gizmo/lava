$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - on_success action to dispatch another job with bad jinja in child job ID

type: cmd

job_id: <{ prefix.job }>/action/dispatch/bad-child-job

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

globals:
  global1: "g1"
  global2: "g2"

payload: >-
  echo on_success action to dispatch another job with bad jinja in child job ID.

on_success:
  - action: dispatch
    job_id: "{{ bad jinja"
    parameters:
      param1: "p1"
      param2: "p2"

x-lava-nocheck: joborphan

x-lava-test:
  result: OK
  marks:
    - local
