$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Job 2 allowed to fail and 2 of 3 does fail (list glob)

type: chain

job_id: <{ prefix.job }>/chain/multi-can-fail-3

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload:
  - <{ prefix.job }>/cmd/hello-world
  - <{ prefix.job }>/exe/exit-123
  - <{ prefix.job }>/cmd/hello-world

parameters:
  can_fail:
    - '*/exit-123'
    - 'no-matches-here'

# No globals
globals: {}

x-lava-nocheck: joborphan

x-lava-test:
  result: OK
  marks:
    - local
