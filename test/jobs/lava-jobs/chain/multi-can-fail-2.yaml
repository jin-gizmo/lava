$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: OK - Job 3 allowed to fail and 3 of 3 does fail

type: chain

job_id: <{ prefix.job }>/chain/multi-can-fail-2

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload:
  - <{ prefix.job }>/cmd/hello-world
  - <{ prefix.job }>/cmd/hello-world
  - <{ prefix.job }>/exe/exit-123

parameters:
  can_fail: '*/exit-123'

# No globals
globals: {}

x-lava-nocheck: joborphan

x-lava-test:
  result: OK
  marks:
    - local
