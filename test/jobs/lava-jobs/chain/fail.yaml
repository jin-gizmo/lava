$schema: http://127.0.0.1:8000/schemas/latest/job.schema.yaml

description: Fail - Single job in chain that fails

type: chain

job_id: <{ prefix.job }>/chain/fail

worker: <{ worker.main }>
enabled: true
owner: <{ owner }>

payload:
  - <{ prefix.job }>/exe/exit-123

# No globals
globals: { }

x-lava-nocheck: joborphan

x-lava-test:
  result: FAIL
  error_pattern: "Failed with exit status 123"
  marks:
    - local
