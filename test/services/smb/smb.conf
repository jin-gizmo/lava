[global]
    workgroup = LAVA
    server string = Samba Server %v
    netbios name = lavatest
    security = user
    map to guest = bad user
    dns proxy = no

[lavatest]
    path = /smb-data
    browsable = yes
    writable = yes
    guest ok = no
    read only = no
    create mask = 0644
    directory mask = 0755
