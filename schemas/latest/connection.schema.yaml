          type: string
          minLength: 1
        subtype:
          description: Specifies the underlying DBAPI 2.0 driver.
          type: string
          enum:
            - pg8000
            - pygresql
        user:
          description: Database user name.
          type: string
          minLength: 1
    postgres-rds:
      title: Lava postgres-aurora connection parameters
      type: object
      allOf:
        - $ref: '#/$defs/common/netloc'
        - $ref: '#/$defs/common/ssl-config'
      properties:
        database:
          description: The name of the database within the database server.
          type: string
          minLength: 1
        password:
          description: The name of an encrypted SSM parameter containing the password.
          type: string
          minLength: 1
        preserve_case:
          description: Don't fold database object names to lower case when quoting
            them for use in db_from_s3 jobs.
          type: boolean
        secret_id:
          description: Obtain missing fields from the specified secret in AWS Secrets
            Manager.
          type: string
          minLength: 1
        subtype:
          description: Specifies the underlying DBAPI 2.0 driver.
          type: string
          enum:
            - pg8000
            - pygresql
        user:
          description: Database user name.
          type: string
          minLength: 1
    psql:
      title: Lava postgres connection parameters
      type: object
      allOf:
        - $ref: '#/$defs/common/netloc'
        - $ref: '#/$defs/common/ssl-config'
      properties:
        database:
          description: The name of the database within the database server.
          type: string
          minLength: 1
        password:
          description: The name of an encrypted SSM parameter containing the password.
          type: string
          minLength: 1
        preserve_case:
          description: Don't fold database object names to lower case when quoting
            them for use in db_from_s3 jobs.
          type: boolean
        secret_id:
          description: Obtain missing fields from the specified secret in AWS Secrets
            Manager.
          type: string
          minLength: 1
        subtype:
          description: Specifies the underlying DBAPI 2.0 driver.
          type: string
          enum:
            - pg8000
            - pygresql
        user:
          description: Database user name.
          type: string
          minLength: 1
    redshift:
      title: Lava redshift connection parameters
      type: object
      allOf:
        - $ref: '#/$defs/common/netloc'
        - $ref: '#/$defs/common/ssl-config'
      properties:
        cluster_id:
          description: The Redshift cluster identifier.
          type: string
          minLength: 1
        database:
          description: The name of the database within the database server.
          type: string
          minLength: 1
        password_duration:
          description: The password duration when generating temporary IAM user credentials
          $ref: '#/$defs/common/duration'
        password:
          description: The name of an encrypted SSM parameter containing the password.
          type: string
          minLength: 1
        preserve_case:
          description: Don't fold database object names to lower case when quoting
            them for use in db_from_s3 jobs.
          type: boolean
        secret_id:
          description: Obtain missing fields from the specified secret in AWS Secrets
            Manager.
          type: string
          minLength: 1
        subtype:
          description: Specifies the underlying DBAPI 2.0 driver.
          type: string
          enum:
            - pg8000
            - redshift
        user:
          description: Database user name.
          type: string
          minLength: 1
    redshift-serverless:
      title: Lava redshift-serverless connection parameters
      type: object
      allOf:
        - $ref: '#/$defs/common/netloc'
        - $ref: '#/$defs/common/ssl-config'
      properties:
        database:
          description: The name of the database within the Redshift Serverless namespace.
          type: string
          minLength: 1
        external_id:
          description: Name of an SSM parameter containing an external ID to use when
            assuming the IAM role specified by role_arn.
          type: string
          minLength: 1
        password_duration:
          description: The password duration when generating temporary IAM user credentials
          $ref: '#/$defs/common/duration'
        password:
          description: The name of an encrypted SSM parameter containing the password.
          type: string
          minLength: 1
        preserve_case:
          description: Don't fold database object names to lower case when quoting
            them for use in db_from_s3 jobs.
          type: boolean
        role_arn:
          description: The ARN of an IAM role that will be assumed when generating
            temporary IAM user credentials.
          type: string
          minLength: 1
        secret_id:
          description: Obtain missing fields from the specified secret in AWS Secrets
            Manager.
          type: string
          minLength: 1
        subtype:
          description: Specifies the underlying DBAPI 2.0 driver.
          type: string
          enum:
            - pg8000
            - redshift
        user:
          description: Database user name.
          type: string
          minLength: 1
        workgroup:
          description: The name of the workgroup associated with the database
          type: string
          minLength: 1
    scp:
      title: Lava ssh/scp/sftp connection parameters
      type: object
      properties:
        ssh_key:
          description: The name of an encrypted SSM parameter containing the SSH private
