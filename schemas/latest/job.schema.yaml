$schema: https://json-schema.org/draft/2020-12/schema
$id: https://jin-gizmo.github.io/lava/schemas/latest/job.schema.yaml
version: v8.3.0
documentation: https://jin-gizmo.github.io/lava
title: Lava job specification
type: object
properties:
  cw_metrics:
    description: Enable/disable generation of CloudWatch custom metrics for this job.
    type: boolean
  description:
    description: A short description of the job.
    type: string
    minLength: 1
  dispatcher:
    description: An identifier specifying the dispatcher for the job.
    type: string
    minLength: 1
  enabled:
    description: Whether or not the job is enabled. Defaults to false.
    oneOf:
      - type: boolean
      - type: string
  event_log:
    description: Record the specified information in the events table.
  globals:
    description: A map of named values that are made available for Jinja rendering
      of job actions and job parameters for those job types that use Jinja parameter
      rendering. Global names cannot start with "lava".
    type: object
    propertyNames:
      not:
        pattern: ^[lL][aA][vV][aA]
  iteration_delay:
    description: The delay between attempts to run the job as a duration.
    $ref: '#/$defs/common/duration'
  iteration_limit:
    description: The number of attempts that will be made to run the job.
    type: integer
    minimum: 0
  job_id:
    description: The job identifier which must be unique for the realm.
    type: string
    minLength: 1
  max_run_delay:
    description: The maximum allowed delay between when a job is dispatched and when
      it is run.
    $ref: '#/$defs/common/duration'
  max_tries:
    description: By default, if a lava worker fails mid-job, SQS will resubmit the
      dispatch request at the end of the visibility timeout. If max_tries is set to
      a positive integer value, then the dispatch message will be discarded when the
      SQS message ApproximateReceiveCount exceeds the specified value.
    type: integer
    minimum: 0
  on_fail:
    description: Job specific on_fail actions for the job
    type: array
    items:
      $ref: '#/$defs/job/action'
  on_retry:
    description: Job specific on_retry actions for the job
    type: array
    items:
      $ref: '#/$defs/job/action'
  on_success:
    description: Job specific on_success actions for the job
    type: array
    items:
      $ref: '#/$defs/job/action'
  owner:
    description: Identifies the owner of the job.
    type: string
    minLength: 1
  parameters:
    description: A map of parameters that will be passed to the job.
    type: object
  payload:
    description: The job payload. The type and format is job type dependent. Currently,
      a value is required even for job types that do not need it. In this case set
      the value to null.
    oneOf:
      - type: 'null'
      - type: string
      - type: array
      - type: object
  schedule:
    description: Job schedule
    anyOf:
      - $ref: '#/$defs/schedule'
      - type: array
        items:
          $ref: '#/$defs/schedule'
      - type: string
        maxLength: 0
      - type: 'null'
      - type: string
        pattern: ^--$
  state:
    description: A map of state items keyed on state_id
    type: object
  type:
    description: Job type
    type: string
    enum:
      - chain
      - cmd
      - dag
      - db_from_s3
      - dispatch
      - docker
      - exe
      - foreach
      - lavasched
      - log
      - pkg
      - redshift_unload
      - sharepoint_get_doc
      - sharepoint_get_list
      - sharepoint_get_multi_doc
      - sharepoint_put_doc
      - sharepoint_put_list
      - smb_get
      - smb_put
      - sql
      - sqlc
      - sqli
      - sqlv
  worker:
    description: The name of a worker that can run the job.
    type: string
    minLength: 1
allOf:
  - if:
      properties:
        type:
          const: chain
    then:
      properties:
        parameters:
          $ref: '#/$defs/job/parameters.d/chain'
  - if:
      properties:
        type:
          const: cmd
    then:
      properties:
        parameters:
          $ref: '#/$defs/job/parameters.d/cmd'
  - if:
      properties:
        type:
          const: dag
    then:
      properties:
        parameters:
          $ref: '#/$defs/job/parameters.d/dag'
  - if:
      properties:
        type:
          const: db_from_s3
    then:
      properties:
        parameters:
          $ref: '#/$defs/job/parameters.d/db_from_s3'
  - if:
      properties:
        type:
          const: dispatch
    then:
      properties:
        parameters:
          $ref: '#/$defs/job/parameters.d/dispatch'
  - if:
      properties:
        type:
          const: docker
    then:
      properties:
        parameters:
          $ref: '#/$defs/job/parameters.d/docker'
  - if:
      properties:
        type:
          const: exe
    then:
      properties:
        parameters:
          $ref: '#/$defs/job/parameters.d/exe'
  - if:
      properties:
        type:
          const: foreach
    then:
      properties:
        parameters:
          $ref: '#/$defs/job/parameters.d/foreach'
  - if:
      properties:
        type:
          const: lavasched
    then:
      properties:
        parameters:
          $ref: '#/$defs/job/parameters.d/lavasched'
  - if:
      properties:
        type:
          const: log
    then:
      properties:
        parameters:
          $ref: '#/$defs/job/parameters.d/log'
  - if:
      properties:
        type:
          const: pkg
    then:
      properties:
        parameters:
          $ref: '#/$defs/job/parameters.d/pkg'
  - if:
      properties:
        type:
          const: redshift_unload
    then:
      properties:
        parameters:
          $ref: '#/$defs/job/parameters.d/redshift_unload'
  - if:
      properties:
        type:
          const: sharepoint_get_doc
    then:
      properties:
        parameters:
          $ref: '#/$defs/job/parameters.d/sharepoint_get_doc'
  - if:
      properties:
        type:
          const: sharepoint_get_list
    then:
      properties:
        parameters:
          $ref: '#/$defs/job/parameters.d/sharepoint_get_list'
  - if:
      properties:
        type:
          const: sharepoint_get_multi_doc
    then:
      properties:
        parameters:
          $ref: '#/$defs/job/parameters.d/sharepoint_get_multi_doc'
  - if:
      properties:
        type:
          const: sharepoint_put_doc
    then:
      properties:
        parameters:
          $ref: '#/$defs/job/parameters.d/sharepoint_put_doc'
  - if:
      properties:
        type:
          const: sharepoint_put_list
    then:
      properties:
        parameters:
          $ref: '#/$defs/job/parameters.d/sharepoint_put_list'
  - if:
      properties:
        type:
          const: smb_get
    then:
      properties:
        parameters:
          $ref: '#/$defs/job/parameters.d/smb_get'
  - if:
      properties:
        type:
          const: smb_put
    then:
      properties:
        parameters:
          $ref: '#/$defs/job/parameters.d/smb_put'
  - if:
      properties:
        type:
          const: sql
    then:
      properties:
        parameters:
          $ref: '#/$defs/job/parameters.d/sql'
  - if:
      properties:
        type:
          const: sqlc
    then:
      properties:
        parameters:
          $ref: '#/$defs/job/parameters.d/sqlc'
  - if:
      properties:
        type:
          const: sqli
    then:
      properties:
        parameters:
          $ref: '#/$defs/job/parameters.d/sqli'
  - if:
      properties:
        type:
          const: sqlv
    then:
      properties:
        parameters:
          $ref: '#/$defs/job/parameters.d/sqlv'
patternProperties:
  ^[xX]-:
    description: X-* fields are ignored by lava.
  ^\$schema$:
    type: string
required:
  - job_id
  - payload
  - type
  - worker
  - description
  - owner
unevaluatedProperties: false
$defs:
  schedule:
    title: A lava schedule entry.
    description: Lava schedule entries can be a simple crontab specification or a
      lava schedule specification consisting of a crontab specification and from/to
      timestamps.
    anyOf:
      - description: Simple crontab
        type: string
        pattern: ^([^ ]+ +){4}[^ ]+$
      - description: Lava schedule specification
        type: object
        additionalProperties: false
        required:
          - crontab
        properties:
          crontab:
            type: string
            pattern: ^([^ ]+ +){4}[^ ]+$
          from:
            type: string
            format: date-time
          to:
            type: string
            format: date-time
  common:
    arn:
      title: arn
      description: AWS ARN
      type: string
      pattern: ^arn:(aws|aws-cn|aws-us-gov):([a-zA-Z0-9-]+):([a-z0-9-]*):([0-9]{12}|):(.+)$
    bucket:
      title: S3 bucket name.
      description: S3 bucket name.
      type: string
      pattern: ^[a-z0-9][-.a-z0-9]{1,61}[a-z0-9]$
    duration:
      title: A lava duration specification
      description: A "duration" is a string in the form nnX where nn is a number and
        X is s (seconds), m (minutes) or h (hours), d (days) or w (weeks). If X is
        not specified, seconds are assumed. A durations is always >= 0.
      oneOf:
        - type: number
          minimum: 0
        - type: string
          pattern: ^[0-9]*(\.[0-9]*)?[smhdw]?$
    netloc:
      title: A network location / endpoint
      description: A network location is a host name + port number.
      type: object
      properties:
        host:
          description: The database host DNS name or IP address.
          type: string
          minLength: 1
        port:
          description: The database port number.
          $ref: '#/$defs/common/posint'
    posint:
      title: A lava positive integer specification
      description: Lava is tolerant on integer values (for now).
      oneOf:
        - type: integer
          minimum: 1
        - type: string
          pattern: ^[0-9]+$
    size:
      title: A lava (data) size specification
      description: A "size" is a string in the form nnX where nn is a number and X
        is a case-sensitive unit specifier. If X is not specified, bytes are assumed.
        A size is always >= 0.
      oneOf:
        - type: number
          minimum: 0
        - type: string
          pattern: ^[0-9]*(\.[0-9]*)?(B|K|KB|M|MB|G|GB|T|TB|P|PB|KiB|MiB|GiB|TiB|PiB)?$
    ssl-config:
      title: SSL configuration options for database connections
      description: SSL configuration options for database connections.
      type: object
      properties:
        ssl_mode:
          description: SSL/TLS verification mode
          type: string
          enum:
            - require
            - verify-ca
            - verify-full
        ssl_ca_file:
          description: File name or URI for server certificate.
          type: string
          minLength: 1
        ssl:
          description: (Deprecated) Enable SSL/TLS. Use ssl_mode=require.
          type: boolean
          default: false
          deprecated: true
        ca_cert:
          description: (Deprecated) File name or URI for server certificate. Use ssl_ca_file.
          type: string
          minLength: 1
          deprecated: true
  job:
    action:
      title: Lava action specification
      oneOf:
        - $ref: '#/$defs/job/action.d/dispatch'
        - $ref: '#/$defs/job/action.d/email'
        - $ref: '#/$defs/job/action.d/event'
        - $ref: '#/$defs/job/action.d/log'
        - $ref: '#/$defs/job/action.d/slack'
        - $ref: '#/$defs/job/action.d/sns'
        - $ref: '#/$defs/job/action.d/sqs'
        - $ref: '#/$defs/job/action.d/state'
    parameters.d:
      chain:
        title: Lava chain job parameters specification
        type: object
        properties:
          job_prefix:
            description: Prepend the specified value to each job ID in the payload.
            type: string
            minLength: 1
          start:
            description: The job_id of the starting point in the chain.
            type: string
            minLength: 1
          can_fail:
            description: Glob pattern, or list of patterns, matching jobs allowed
              to fail.
            anyOf:
              - type: string
                minLength: 1
              - type: array
                items:
                  type: string
                  minLength: 1
        additionalProperties: false
      cmd:
        title: Lava cmd job parameters specification
        type: object
        properties:
          args:
            description: A list of additional arguments for the command.
            type: array
            items:
              type:
                - string
                - number
          env:
            description: A map of additional environment variables for the command.
            type: object
          jinja:
            description: Enable Jinja rendering of the payload.
            type: boolean
          timeout:
            description: Timeout before lava kills the job.
            $ref: '#/$defs/common/duration'
          vars:
            description: A map of variables injected when the command arguments and
              environment are Jinja rendered.
            type: object
        additionalProperties: false
      foreach.d:
        csv:
          title: csv foreach specification
          type: object
          properties:
            type:
              type: string
              const: csv
            filename:
              type: string
              minLength: 1
          required:
            - type
            - filename
          additionalProperties: false
        inline:
          title: inline foreach specification
          type: object
          properties:
            type:
              type: string
              const: inline
            values:
              type: array
              items:
                type: object
                propertyNames:
                  not:
                    pattern: ^[lL][aA][vV][aA]
          required:
            - type
            - values
          additionalProperties: false
        jsonl:
          title: jsonl foreach specification
          type: object
          properties:
            type:
              type: string
              const: jsonl
            filename:
              type: string
              minLength: 1
          required:
            - type
            - filename
          additionalProperties: false
        query:
          title: query foreach specification
          type: object
          properties:
            type:
              type: string
              const: query
            conn_id:
              type: string
              minLength: 1
            query:
              type: string
              minLength: 1
          required:
            - type
            - conn_id
            - query
          additionalProperties: false
        range:
          title: range foreach specification
          type: object
          properties:
            type:
              type: string
              const: range
            name:
              type: string
              minLength: 1
            start:
              type: integer
            stop:
              type: integer
            step:
              type: integer
          required:
            - type
            - stop
          additionalProperties: false
        s3list:
          title: s3list foreach specification
          type: object
          properties:
            type:
              type: string
              const: s3list
            bucket:
              type: string
              minLength: 1
            prefix:
              type: string
            glob:
              oneOf:
                - type: string
                  minLength: 1
                - type: array
                  items:
                    type: string
          required:
            - type
            - bucket
          additionalProperties: false
      dag:
        title: Lava dag job parameters specification
        type: object
        properties:
          job_prefix:
            description: Prepend the specified value to each job ID in the payload.
            type: string
            minLength: 1
          workers:
            description: The number of worker threads to use for running child jobs.
            type: integer
            minimum: 0
          can_fail:
            description: Glob pattern, or list of patterns, matching jobs allowed
              to fail.
            anyOf:
              - type: string
                minLength: 1
              - type: array
                items:
                  type: string
                  minLength: 1
        additionalProperties: false
      db_from_s3:
        title: Lava db_from_s3 job parameters specification
        type: object
        properties:
          args:
            description: Database type specific arguments.
          bucket:
            description: The name of the S3 bucket from which the data is copied.
            type: string
            minLength: 1
          columns:
            description: A list of SQL column specifications.
            type: array
            items:
              type: string
              minLength: 1
          db_conn_id:
            description: The connection ID for a target database.
            type: string
            minLength: 1
          jinja:
            description: If false, disable Jinja rendering of the parameters and globals.
            type: boolean
          key:
            description: The key in the S3 bucket from which the data is copied.
            type: string
            minLength: 1
          min_size:
            description: Avoid loading files below the specified size.
            $ref: '#/$defs/common/size'
          mode:
            description: Update mode for the target table.
            type: string
            enum:
              - abort
              - append
              - drop
              - delete
              - switch
              - truncate
          s3_conn_id:
            description: The connection ID for AWS S3.
            type: string
            minLength: 1
          s3_iam_role:
            description: The IAM role name used to allow access to the source data
              in S3.
            type: string
            minLength: 1
          schema:
            description: Target schema name.
            type: string
            minLength: 1
          skip_missing:
            description: Skip missing files without throwing an error.
            type: boolean
          table:
            description: Target table name.
            type: string
            minLength: 1
          vars:
            description: A map of variables injected when the command arguments and
              environment are Jinja rendered.
            type: object
        required:
          - bucket
          - key
          - db_conn_id
          - mode
          - schema
          - table
        additionalProperties: false
      dispatch:
        title: Lava dispatch job parameters specification
        type: object
        properties:
          delay:
            description: Dispatch delay.
            $ref: '#/$defs/common/duration'
          jinja:
            description: Enable Jinja rendering of the payload.
            type: boolean
          job_prefix:
            description: Prepend the specified value to each job ID in the payload.
            type: string
            minLength: 1
          parameters:
            description: A map of parameters that will be sent with the dispatch.
            type: object
        additionalProperties: false
      docker:
        title: Lava docker job parameters specification
        type: object
        properties:
          args:
            description: A list of additional arguments for the command.
            type: array
            items:
              anyOf:
                - type: string
                - type: number
          command:
            description: The command to run in the container.
            type: string
            minLength: 1
          connections:
            description: A dictionary with keys that are connection labels and the
              values are conn_id
            type: object
          docker:
            description: The conn_id for connecting to docker.
            type: string
            minLength: 1
          env:
            description: A map of additional environment variables for the command.
            type: object
          host_config:
            description: A map of container host configuration parameters.
            type: object
          jinja:
            description: Enable Jinja rendering of the payload.
            type: boolean
          timeout:
            description: Timeout before lava kills the job.
            $ref: '#/$defs/common/duration'
          vars:
            description: A map of variables injected when the command arguments and
              environment are Jinja rendered.
            type: object
        additionalProperties: false
      exe:
        title: Lava exe job parameters specification
        type: object
        properties:
          args:
            description: A list of additional arguments for the command.
            type: array
            items:
              anyOf:
                - type: string
                - type: number
          connections:
            description: A dictionary with keys that are connection labels and the
              values are conn_id
            type: object
          env:
            description: A map of additional environment variables for the command.
            type: object
          jinja:
            description: Enable Jinja rendering of the payload.
            type: boolean
          timeout:
            description: Timeout before lava kills the job.
            $ref: '#/$defs/common/duration'
          vars:
            description: A map of variables injected when the command arguments and
              environment are Jinja rendered.
            type: object
        additionalProperties: false
      foreach:
        title: Lava foreach job parameters specification
        type: object
        properties:
          foreach:
            description: A dictionary specifying how foreach values are generated
            type: object
            oneOf:
              - $ref: '#/$defs/job/parameters.d/foreach.d/csv'
              - $ref: '#/$defs/job/parameters.d/foreach.d/inline'
              - $ref: '#/$defs/job/parameters.d/foreach.d/jsonl'
              - $ref: '#/$defs/job/parameters.d/foreach.d/query'
              - $ref: '#/$defs/job/parameters.d/foreach.d/range'
              - $ref: '#/$defs/job/parameters.d/foreach.d/s3list'
          can_fail:
            description: Indicates if individual iterations are permitted to fail
            type: boolean
          limit:
            description: Maximum allowed number of foreach values
            type: integer
            minimum: 1
          jinja:
            description: Enable Jinja rendering of the payload.
            type: boolean
        required:
          - foreach
        additionalProperties: false
      lavasched:
        title: Lava lavasched job parameters specification
        type: object
        properties:
          args:
            description: A list of additional arguments that will be added to the
              invocation of lava-dispatcher in the crontab entries.
            type: array
            items:
              anyOf:
                - type: string
                - type: number
          dispatcher:
            description: Name of dispatcher, or a list of names, specifying the dispatchers
              for which schedules should be built.
            anyOf:
              - type: string
                minLength: 1
              - type: array
                items:
                  type: string
                  minLength: 1
          env:
            description: A map of additional environment variables for the command.
            type: object
        required:
          - dispatcher
        additionalProperties: false
      log:
        title: Lava log job parameters specification
        type: object
        properties: {}
        additionalProperties: true
      pkg:
        title: Lava pkg job parameters specification
        type: object
        properties:
          args:
            description: A list of additional arguments for the command.
            type: array
            items:
              anyOf:
                - type: string
                - type: number
          command:
            description: The name of the entry point executable in the bundle, relative
              to the root of the bundle.
            type: string
            minLength: 1
          connections:
            description: A dictionary with keys that are connection labels and the
              values are conn_id.
            type: object
          env:
            description: A map of additional environment variables for the command.
            type: object
          jinja:
            description: Enable Jinja rendering of the payload.
            type: boolean
          timeout:
            description: Timeout before lava kills the job.
            $ref: '#/$defs/common/duration'
          vars:
            description: A map of variables injected when the command arguments and
              environment are Jinja rendered.
            type: object
        unevaluatedProperties: false
      redshift_unload:
        title: Lava redshift_unload job parameters specification
        type: object
        properties:
          args:
            description: A list of options for the UNLOAD command.
            type: array
            items:
              type: string
              minLength: 1
          bucket:
            description: The name of the S3 bucket to which the data is unloaded.
            type: string
            minLength: 1
          conn_id:
            description: The connection ID for a Redshift cluster.
            type: string
            minLength: 1
          dateformat:
            description: A Redshift datetime format string that will be applied to
              DATE fields when unloading.
            type: string
            minLength: 1
          insecure:
            description: Disable bucket security checks.
            type: boolean
            default: false
          prefix:
            description: The prefix in the S3 bucket to which the data is unloaded.
            type: string
            minLength: 1
          relation:
            description: The name of the table or view to be unloaded (without schema)
              or a list of names.
            anyOf:
              - type: string
                minLength: 1
              - type: array
                items:
                  type: string
                  minLength: 1
          s3_conn_id:
            description: The connection ID for AWS S3.
            type: string
            minLength: 1
          s3_iam_role:
            description: The IAM role name used to allow access to the source data
              in S3.
            type: string
            minLength: 1
          schema:
            description: The name of the source schema for the object to be unloaded.
            type: string
            minLength: 1
          start:
            description: Name of the relation to start with when unloading a list
              of relations. If not specified, start at the beginning of the list.
            type: string
            minLength: 1
          stop_on_fail:
            description: If true, stop when any unload fails otherwise keep moving
              through the unload list.
            type: boolean
          vars:
            description: A map of variables injected when the command arguments and
              environment are Jinja rendered.
            type: object
          where:
            description: An optional WHERE condition for the UNLOAD queries. Do not
              include the WHERE keyword.
            type: string
            minLength: 1
        required:
          - args
          - bucket
          - conn_id
          - prefix
          - relation
          - schema
        additionalProperties: false
        oneOf:
          - required:
              - s3_conn_id
          - required:
              - s3_iam_role
      sharepoint_get_doc:
        title: Lava sharepoint_get_doc job parameters specification
        type: object
        properties:
          basedir:
            description: If the target file is specified as a relative filename, it
              will be treated as relative to the specified directory.
            type: string
          conn_id:
            description: The connection ID for a SharePoint site.
            type: string
            minLength: 1
          file:
            description: The destination file name. If it starts with s3:// it is
              assumed to be an object in S3, otherwise a local file. If a local file
              and not absolute, it will be relative to the basedir parameter.
