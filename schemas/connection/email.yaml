$schema: https://json-schema.org/draft/2020-12/schema

title: Lava email connection parameters

type: object

properties:
  from:
    description: The email address that is sending the email.
    type: string
    format: email
  reply_to:
    description: The default reply-to email address(es) for messages.
    anyOf:
      - type: string
        format: email
      - type: array
        items:
          type: string
          format: email
  subtype:
    description: Specifies the underlying email handler.
    type: string
    enum:
      # {% for subtype in defs.connection['email.d'] %}
      - "{{ subtype }}"
      # {% endfor %}

# Mix-in for the connection parameters for each sub-type

allOf:
  # If no subtype then defaults to ses
  - if: { properties: { subtype: false } }
    then: { $ref: '#/$defs/connection/email.d/ses' }
  # {% for subtype in defs.connection['email.d'] %}
  - if: { properties: { subtype: { const: "{{ subtype }}" } } }
    then: { $ref: '#/$defs/connection/email.d/{{ subtype }}' }
  # {% endfor %}
