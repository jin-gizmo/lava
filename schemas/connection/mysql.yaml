$schema: https://json-schema.org/draft/2020-12/schema

title: Lava mysql connection parameters

type: object

# Some of these properties are mandatory but marked so here because they can be
# supplied by AWS Secrets Manager at run-time.

allOf:
  - $ref: '#/$defs/common/netloc'
  - $ref: '#/$defs/common/ssl-config'

properties:
  database:
    description: The name of the database within the database server.
    type: string
    minLength: 1
  password:
    description: The name of an encrypted SSM parameter containing the password.
    type: string
    minLength: 1
  preserve_case:
    description: >-
      Don't fold database object names to lower case when quoting them for use
      in db_from_s3 jobs.
    type: boolean
  secret_id:
    description: Obtain missing fields from the specified secret in AWS Secrets Manager.
    type: string
    minLength: 1
  user:
    description: Database user name.
    type: string
    minLength: 1
