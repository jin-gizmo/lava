$schema: https://json-schema.org/draft/2020-12/schema

title: Lava redshift connection parameters

type: object

# Some of these properties are mandatory but marked so here because they can be
# supplied by AWS Secrets Manager at run-time.

allOf:
  - $ref: '#/$defs/common/netloc'
  - $ref: '#/$defs/common/ssl-config'

properties:
  cluster_id:
    description: The Redshift cluster identifier.
    type: string
    minLength: 1
  database:
    description: The name of the database within the database server.
    type: string
    minLength: 1
  password_duration:
    description: The password duration when generating temporary IAM user credentials
    $ref: '#/$defs/common/duration'
  password:
    description: The name of an encrypted SSM parameter containing the password.
    type: string
    minLength: 1
  preserve_case:
    description: >-
      Don't fold database object names to lower case when quoting them for use
      in db_from_s3 jobs.
    type: boolean
  secret_id:
    description: Obtain missing fields from the specified secret in AWS Secrets Manager.
    type: string
    minLength: 1
  subtype:
    description: Specifies the underlying DBAPI 2.0 driver.
    type: string
    enum:
      - pg8000
      - redshift
  user:
    description: Database user name.
    type: string
    minLength: 1
