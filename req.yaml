  - name: docker
    description: Docker CLI
    check: req_has_command docker
    install: |
      echo "See https://www.docker.com/get-started/"
      exit 126

  - name: jq
    description: Command-line JSON processor
    check: req_has_command jq

  - name: aws-cli-v2
    description: AWS CLI v2
    check: req_has_command aws && req_version_eq 2 "$(aws --version | req_extract_version)"
    install: |
      echo "See instructions at https://docs.aws.amazon.com/cli/latest/userguide/getting-started-install.html"
      exit 126

  - name: packer
    description: Used to buid the lava AMI
    check: req_has_command packer
    install: |
      echo "See https://developer.hashicorp.com/packer"
      exit 126

  - name: tokei
    description: Used to count lines of code
    optional: true
    check: req_has_command tokei
    install: |
      case "$REQ_OS"
      in
        darwin)
                echo "Try ..."
                echo "    brew install tokei"
                ;;
        *)
                echo "See https://github.com/xampprocky/tokei#installation"
                ;;
      esac
      exit 126

  - name: shellcheck
    description: Used as part of pre-commit checks
    check: req_has_command shellcheck
    install: |
      case "$REQ_OS"
      in
        darwin)
                echo "Try ..."
                echo "    brew install shellcheck"
                ;;
        *)
                echo "See https://github.com/koalaman/shellcheck"
                ;;
      esac
      exit 126
